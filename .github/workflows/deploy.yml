name: Build and Deploy to Cloud

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build Docker Image and Push to Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------
      # Deployment Option 1: Push to Google Container Registry (GCR) & Deploy to Cloud Run
      # ----------------------------------------------------
      - name: Authenticate to Google Cloud
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: gcloud auth configure-docker --quiet

      - name: Build and Push to GCR
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: gcr.io/${{ secrets.GCP_PROJECT_ID }}/customer-analytics:latest

      - name: Deploy to Google Cloud Run
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          gcloud run deploy customer-analytics \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/customer-analytics:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      # ----------------------------------------------------
      # Deployment Option 2: Push to AWS Elastic Container Registry (ECR)
      # ----------------------------------------------------
      - name: Configure AWS Credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push to ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/customer-analytics:latest

